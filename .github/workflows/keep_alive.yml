name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows you to manually test it

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install streamlit-wakeup
        run: pip install streamlit-wakeup

      - name: Ping Streamlit App
        run: streamlit-wakeup https://nycawardtracker.streamlit.app